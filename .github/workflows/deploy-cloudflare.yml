name: Build & Deploy to Cloudflare Pages

# Builds the Vite/React site and deploys it to the Cloudflare Pages
# project "lourinha" → https://lourinha.richmorgan.co.uk
#
# Replaces the old GitHub Pages deploy. The old URL now serves a redirect
# stub published by pages.yml.
#
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID — the account id

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lourinha --branch=main
